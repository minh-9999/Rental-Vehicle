name: Bump Version and Tag

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches: [master]

jobs:
  bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Get latest version tag
        id: get_tag
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || echo "v0.0.0")
          echo "Latest tag: $latest_tag"
          echo "latest=$latest_tag" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next
        run: |
          version="${{ steps.get_tag.outputs.latest }}"
          version="${version#v}"
          IFS='.' read -r major minor patch <<< "$version"

          bump="${{ github.event.inputs.level }}"
          if [ -z "$bump" ]; then
            bump="patch"
          fi

          if [[ "$bump" == "major" ]]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [[ "$bump" == "minor" ]]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="v$major.$minor.$patch"
          echo "New version: $new_version"
          echo "new_tag=$new_version" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          new_version="${{ steps.next.outputs.new_tag }}"
          git fetch --tags
          if git rev-parse "$new_version" >/dev/null 2>&1; then
            echo "Tag $new_version already exists, skipping..."
          else
            git tag -a "$new_version" -m "Release $new_version"
            git push origin "$new_version"
          fi
